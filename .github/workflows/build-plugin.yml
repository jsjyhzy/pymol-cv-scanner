name: build-pymol-plugin

on:
  push:
    branches: [master]        # validation on every merge
    tags: ['v*']              # release build
  pull_request:
    branches: [master]        # validation on PRs
  workflow_dispatch:          # manual build

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          V=$(sed -n 's/^# Version: //p' src/__init__.py)
          test "$V" = "${GITHUB_REF_NAME#v}" || { echo "version $V != tag $GITHUB_REF_NAME"; exit 1; }

      - name: Syntax check
        run: make check

      - name: Build plugin tarball
        run: make dist

      - name: Validate archive
        run: make test

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: distance-scan-plugin
          path: dist/distance_scan_plugin-*.tar.gz

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/distance_scan_plugin-*.tar.gz --title "$GITHUB_REF_NAME"